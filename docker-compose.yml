services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: composer
      POSTGRES_PASSWORD: composer
      POSTGRES_DB: composer
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U composer -d composer"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot job: applies migrations, then loads the seed if the users table is empty.
  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://composer:composer@postgres:5432/composer?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["api"]
    environment:
      DATABASE_URL: postgres://composer:composer@postgres:5432/composer?sslmode=disable
    # ANTHROPIC_API_KEY, LLM_PROVIDER, ANTHROPIC_MODEL... Without a .env (or without a
    # key in it) the API runs on the mock LLM.
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  # Mock SMS/email provider. Failure rates and limits come from .env (PROVIDER_*);
  # the defaults inject 5xx, throttling, timeouts and latency on every run.
  mock-provider:
    build: .
    command: ["mock-provider"]
    env_file:
      - path: .env
        required: false
    environment:
      PROVIDER_ADDR: ":8090"
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "/app", "healthcheck", "http://localhost:8090/healthz"]
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  worker:
    build: .
    command: ["worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://composer:composer@postgres:5432/composer?sslmode=disable
      PROVIDER_URL: http://mock-provider:8090
      WORKER_HEALTH_ADDR: ":8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app", "healthcheck", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 4s
      retries: 10
    # Lets in-flight sends finish on shutdown (HTTP timeout 3s + result write).
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
